name: 台股早安精選

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 08:30 台灣時間 (UTC+8)，週一至週五
  workflow_dispatch:           # 手動觸發

permissions:
  contents: write

jobs:
  morning-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip -q
          pip install "yfinance>=1.0.0" "requests>=2.31.0" "pandas>=2.0.0" "numpy>=1.24.0" "beautifulsoup4>=4.12.0" "lxml>=4.9.0" "rich>=13.0.0" -q

      - name: Run morning analysis
        run: python morning_picks.py --output data/morning_picks.json
        timeout-minutes: 5

      - name: Commit and push
        run: |
          git config user.name  "台股早安精選 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/morning_picks.json
          git diff --staged --quiet || git commit -m "chore: morning picks $(TZ=Asia/Taipei date +%Y-%m-%d)"
          git push
