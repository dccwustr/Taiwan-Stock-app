name: 台股早安精選

on:
  schedule:
    # 主要由本機 launchd（com.stock.morning_picks，08:45）產生；這裡只當備援。
    # GitHub 排程實測常晚 4–6 小時，所以本機今天已跑過就跳過，避免盤後覆蓋盤前結果。
    - cron: '30 0 * * 1-5'   # 08:30 台灣時間 (UTC+8)，週一至週五
  workflow_dispatch:           # 手動觸發

permissions:
  contents: write

jobs:
  morning-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Skip if local run already published today
        id: guard
        run: |
          today=$(TZ=Asia/Taipei date +%Y-%m-%d)
          have=$(python3 -c "import json;print(json.load(open('data/morning_picks.json')).get('date',''))")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$have" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天的精選已由本機產生（$have），跳過"
          fi

      - name: Set up Python 3.11
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install --upgrade pip -q
          pip install "yfinance>=1.0.0" "requests>=2.31.0" "pandas>=2.0.0" "numpy>=1.24.0" "beautifulsoup4>=4.12.0" "lxml>=4.9.0" "rich>=13.0.0" -q

      - name: Run morning analysis
        if: steps.guard.outputs.skip != 'true'
        run: python morning_picks.py --output data/morning_picks.json
        timeout-minutes: 5

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "台股早安精選 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/morning_picks.json data/pick_log.csv
          if [ -f data/dip_log.csv ]; then git add data/dip_log.csv; fi
          git diff --staged --quiet || git commit -m "chore: morning picks $(TZ=Asia/Taipei date +%Y-%m-%d)"
          git pull --rebase -q
          git push
